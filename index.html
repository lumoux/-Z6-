<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>群英并起｜九州开局人格测试</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%}body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;color:#f8ead4;background:radial-gradient(circle at 50% -10%,rgba(219,170,82,.34),transparent 34%),radial-gradient(circle at 12% 20%,rgba(161,34,28,.38),transparent 30%),linear-gradient(180deg,#100806,#26100c 44%,#080605);overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,rgba(224,178,91,.05) 1px,transparent 1px),linear-gradient(180deg,rgba(224,178,91,.05) 1px,transparent 1px);background-size:34px 34px;pointer-events:none}.page{width:min(100%,430px);min-height:100vh;margin:0 auto;padding:14px 12px 22px;position:relative;z-index:1;display:flex;align-items:center;justify-content:center}.panel{width:100%;min-height:calc(100vh - 32px);border-radius:28px;border:1px solid rgba(214,169,88,.26);background:linear-gradient(180deg,rgba(41,23,18,.94),rgba(15,10,8,.97));box-shadow:0 22px 70px rgba(0,0,0,.48);overflow:hidden;position:relative}.panel:before{content:"";position:absolute;inset:12px;border-radius:22px;border:1px solid rgba(214,169,88,.13);pointer-events:none}.inner{min-height:calc(100vh - 32px);padding:20px 16px;position:relative;z-index:2;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brand-logo{height:42px;max-width:180px;object-fit:contain;display:block;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}.season{color:rgba(248,234,212,.72);font-size:13px;font-weight:1000;white-space:nowrap;text-align:right}.badge{display:inline-flex;border:1px solid rgba(214,169,88,.36);background:rgba(214,169,88,.1);color:#f4d597;border-radius:999px;padding:8px 12px;font-weight:900;font-size:13px}.start,.result,.question{flex:1;display:flex;flex-direction:column;justify-content:center}.hero-card,.q-card,.result-card{border-radius:26px;background:linear-gradient(180deg,rgba(100,32,24,.66),rgba(22,13,10,.78));border:1px solid rgba(214,169,88,.22);box-shadow:0 16px 42px rgba(0,0,0,.27);overflow:hidden;position:relative}.hero-card{padding:14px;text-align:center}.kv{border-radius:18px;overflow:hidden;border:1px solid rgba(214,169,88,.25);margin-bottom:14px;background:#120b08}.kv img{display:block;width:100%}.kicker{display:inline-block;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,#b92f25,#d8a646);color:#fff7df;font-size:13px;font-weight:1000}h1{margin:15px 0 7px;font-size:38px;line-height:1.06;font-weight:1000;letter-spacing:-1px;color:#fff4d2;text-shadow:0 3px 0 rgba(0,0,0,.22)}h1 span{display:block;color:#e3b15d}.lead{margin:0 auto;max-width:350px;color:rgba(248,234,212,.76);line-height:1.75;font-size:13px;font-weight:700;text-align:center}.lead span{display:block;white-space:nowrap}.disclaimer{margin:10px auto 0;max-width:350px;color:rgba(248,234,212,.52);line-height:1.55;font-size:11px;font-weight:700}.force-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.force-mini{min-height:118px;border:1px solid rgba(214,169,88,.18);background:radial-gradient(circle at 50% 25%,rgba(227,177,93,.16),rgba(255,255,255,.035) 62%);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}.force-mini img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:94%;height:90px;object-fit:contain;filter:drop-shadow(0 7px 6px rgba(0,0,0,.35))}.force-mini .name{position:relative;z-index:2;padding:28px 6px 8px;color:#f4d597;font-weight:1000;font-size:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}.force-mini small{display:block;color:rgba(248,234,212,.58);font-size:9px;margin-top:2px}.btn{width:100%;border:0;cursor:pointer;border-radius:18px;padding:15px 16px;margin-top:15px;color:#211009;background:linear-gradient(90deg,#efd08a,#c99038);font-size:17px;font-weight:1000;box-shadow:0 14px 26px rgba(201,144,56,.18)}.btn.dark{color:#f8ead4;background:rgba(255,255,255,.07);border:1px solid rgba(214,169,88,.24);box-shadow:none}.progress-top{display:flex;justify-content:space-between;color:rgba(248,234,212,.64);font-size:12px;font-weight:900;margin-bottom:8px}.progress{height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(214,169,88,.12);margin-bottom:15px}.bar{height:100%;background:linear-gradient(90deg,#b92f25,#d8a646)}.q-card{padding:17px 13px}.q-tag{display:inline-block;color:#e3b15d;border:1px solid rgba(214,169,88,.22);background:rgba(214,169,88,.08);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}h2{margin:13px 0 15px;font-size:22px;line-height:1.34;color:#fff2cf;letter-spacing:-.3px}.options{display:grid;gap:9px}.option{width:100%;border:1px solid rgba(214,169,88,.18);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));color:#f8ead4;border-radius:16px;padding:11px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-size:14px;line-height:1.5;font-weight:750}.letter{width:31px;height:31px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;background:linear-gradient(180deg,#b92f25,#7d211b);color:#fff4d2;font-weight:1000}.result-card{padding:18px 14px;background:linear-gradient(160deg,rgba(124,31,23,.86),rgba(27,16,13,.94) 58%,rgba(177,125,48,.55))}.result-card:before{content:attr(data-mark);position:absolute;right:10px;top:8px;font-size:86px;font-weight:1000;color:rgba(255,255,255,.055)}.result-image-wrap{height:190px;margin:-6px -8px 2px;display:flex;align-items:flex-end;justify-content:center;position:relative}.result-image{max-width:230px;max-height:210px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 12px 12px rgba(0,0,0,.48))}.result-label{display:inline-block;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#f4d597;font-size:12px;font-weight:1000}.force-name{margin-top:10px;font-size:54px;line-height:.96;font-weight:1000;color:#fff3cd;text-shadow:0 4px 0 rgba(0,0,0,.22)}.force-title{margin-top:10px;color:#fff3cd;font-size:30px;line-height:1.12;font-weight:1000}.rep{margin-top:8px;color:#e3b15d;font-size:17px;font-weight:1000}.hook{margin:10px auto 0;max-width:330px;color:rgba(248,234,212,.88);font-size:15px;line-height:1.55;font-weight:900}.slogan{margin-top:7px;color:rgba(248,234,212,.78);font-weight:850}.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}.chip{display:flex;align-items:center;justify-content:center;min-height:34px;padding:0 6px;border-radius:999px;background:rgba(227,177,93,.16);border:1px solid rgba(227,177,93,.2);color:#f4d597;font-size:12px;font-weight:1000;text-align:center;white-space:nowrap}.result-text{margin-top:13px;line-height:1.72;font-size:14px;color:rgba(248,234,212,.84);font-weight:750}.info{display:grid;gap:9px;margin-top:12px}.info-box{border-radius:16px;padding:11px;background:rgba(0,0,0,.16);border:1px solid rgba(214,169,88,.14)}.info-box b{display:block;color:#e3b15d;font-size:12px;margin-bottom:5px}.info-box span{color:rgba(248,234,212,.84);line-height:1.6;font-size:13px;font-weight:750}.share{margin-top:11px;padding:11px;border-radius:18px;background:rgba(214,169,88,.1);border:1px solid rgba(214,169,88,.15);color:rgba(248,234,212,.78);line-height:1.6;font-size:13px;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;transition:.2s;z-index:20;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.78);color:#f8ead4;font-size:13px;font-weight:1000}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-height:760px){.force-mini{min-height:104px}.force-mini img{height:78px}.result-image-wrap{height:160px}.result-image{max-height:180px}.force-name{font-size:48px}h1{font-size:34px}h2{font-size:20px}}@media(max-width:360px){.page{padding:10px}.inner{padding:17px 13px}.brand-logo{height:34px;max-width:150px}.season{font-size:11px}h1{font-size:34px}.lead{font-size:12px;line-height:1.72}.force-name{font-size:48px}.actions{grid-template-columns:1fr}}

.share-modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px}
.share-modal.show{display:flex}
.share-box{width:min(100%,380px);border-radius:24px;background:#160d0a;border:1px solid rgba(214,169,88,.3);padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.share-box-title{display:flex;justify-content:space-between;align-items:center;color:#f4d597;font-weight:1000;font-size:14px;margin-bottom:10px}
.share-close{border:0;background:rgba(255,255,255,.08);color:#f8ead4;border-radius:999px;width:30px;height:30px;font-size:18px}
.share-preview{display:block;width:100%;min-height:360px;object-fit:contain;border-radius:18px;background:#0f0806;border:1px solid rgba(214,169,88,.2);-webkit-touch-callout:default;user-select:auto}
.share-tip{margin:10px 4px 2px;color:rgba(248,234,212,.7);font-size:12px;line-height:1.6;font-weight:800;text-align:center}
.actions.three{grid-template-columns:1fr 1fr}.actions.three .wide{grid-column:1/3}
.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}</style></head><body><div class="page"><div class="panel"><div class="inner" id="app"></div></div></div>

function questionPage(){const item=questions[current],pct=Math.round((current+1)/questions.length*100);app.innerHTML=topBar()+`<section class="question"><div class="progress-top"><span>第 ${current+1} 题 / 共 ${questions.length} 题</span><span>${pct}%</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="q-card"><div class="q-tag">${item.tag}</div><h2>${item.q}</h2><div class="options">${item.options.map(([k,t])=>`<button class="option" onclick="choose('${k}')"><span class="letter">${k}</span><span>${t}</span></button>`).join("")}</div></div></section>`}
function getResult(){const scores={A:0,B:0,C:0,D:0,E:0,F:0};answers.forEach(a=>scores[a]++);const max=Math.max(...Object.values(scores)),tied=Object.keys(scores).filter(k=>scores[k]===max);let key=tied[0];if(tied.length>1&&tied.includes(answers[7]))key=answers[7];else if(tied.length>1&&tied.includes(answers[5]))key=answers[5];return{key,scores,tied}}

function startTest(){current=0;answers=[];questionPage()}function choose(k){answers[current]=k;if(current>=questions.length-1)resultPage();else{current++;questionPage()}}function toast(msg="操作成功"){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  let line="",lines=[];
  for(let i=0;i<text.length;i++){
    let test=line+text[i];
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);line=text[i];
      if(lines.length>=maxLines-1)break;
    }else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,maxLines).forEach((l,idx)=>ctx.fillText(l,x,y+idx*lineHeight));
}
function loadImage(src, timeout=1800){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    let done=false;
    const timer=setTimeout(()=>{
      if(done) return;
      done=true;
      reject(new Error("image load timeout: "+src));
    },timeout);
    im.onload=()=>{
      if(done) return;
      done=true;
      clearTimeout(timer);
      resolve(im);
    };
    im.onerror=()=>{
      if(done) return;
      done=true;
      clearTimeout(timer);
      reject(new Error("image load error: "+src));
    };
    im.src=src;
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function setSharePreview(canvas){
  const preview=document.getElementById("sharePreview");
  const fallback=()=>{
    shareBlob=null;
    preview.src=canvas.toDataURL("image/png");
  };
  if(!canvas.toBlob){
    fallback();
    return;
  }
  canvas.toBlob((blob)=>{
    if(!blob){
      fallback();
      return;
    }
    if(shareObjectUrl) URL.revokeObjectURL(shareObjectUrl);
    shareBlob=blob;
    shareObjectUrl=URL.createObjectURL(blob);
    preview.src=shareObjectUrl;
  },"image/png");
}




function openShareCard(){

}

    }catch(e){
      console.warn("embedded character failed:", e);
      ctx.fillStyle="rgba(227,177,93,.16)";

      ctx.fill();
      ctx.fillStyle="#f4d597";
      ctx.font="900 80px sans-serif";
      ctx.textAlign="center";
      ctx.fillText(f.mark,450,315);

    ctx.fillStyle="#fff3cd";
    ctx.font="900 58px sans-serif";
    ctx.fillText(f.title,450,650);

    ctx.fillStyle="#e3b15d";
    ctx.font="900 30px sans-serif";

    ctx.font="900 28px sans-serif";

      ctx.stroke();
      ctx.fillStyle="#f4d597";
      ctx.fillText(k,startX+chipW/2,chipY+32);
      startX+=chipW+chipGap;
    });

    ctx.fillStyle="#f4d597";
    ctx.font="900 28px sans-serif";
    ctx.fillText("扫码参与测试",450,1058);

    try{
      const qr=await loadImage(shareQrImg,2000);

    ctx.stroke();
    ctx.textAlign="center";
    ctx.fillStyle="#f4d597";
    ctx.font="900 48px sans-serif";

    ctx.fillText("扫码参与测试",450,900);
    setSharePreview(canvas);

  }
}

function wrapLines(ctx,text,maxWidth,maxLines){
  let line="",lines=[];
  for(let i=0;i<text.length;i++){
    const test=line+text[i];
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);
      line=text[i];
      if(lines.length>=maxLines-1)break;
    }else{
      line=test;
    }
  }
  if(line)lines.push(line);
  return lines.slice(0,maxLines);
}

function closeShareCard(){
  document.getElementById("shareModal").classList.remove("show");
}

async function downloadShareImage(){
  const imgEl=document.getElementById("sharePreview");
  if(!imgEl.src){
    await showShareCard();
  }
  const src=imgEl.src;
  if(!src){
    toast("分享图还在生成中");
    return;
  }
  try{
    if(shareBlob && navigator.canShare && navigator.share){
      const file=new File([shareBlob],`九州开局人格测试_${Date.now()}.png`,{type:"image/png"});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"九州开局人格测试"});
        toast("已调起系统分享");
        return;
      }
    }
  }catch(e){}
  try{
    const a=document.createElement("a");
    a.href=src;
    a.download=`九州开局人格测试_${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("如未弹出保存，请长按图片或截图保存");
  }catch(e){
    window.open(src,"_blank");
    toast("已打开图片，请长按保存");
  }
}
