<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>群英并起｜九州落点测试</title><style>

hero-card{padding:14px;text-align:center}.kv{border-radius:18px;overflow:hidden;border:1px solid rgba(214,169,88,.25);margin-bottom:14px;background:#120b08}.kv img{display:block;width:100%}.kicker{display:inline-block;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,#b92f25,#d8a646);color:#fff7df;font-size:13px;font-weight:1000}h1{margin:15px 0 7px;font-size:38px;line-height:1.06;font-weight:1000;letter-spacing:-1px;color:#fff4d2;text-shadow:0 3px 0 rgba(0,0,0,.22)}h1 span{display:block;color:#e3b15d}.lead{margin:0 auto;max-width:350px;color:rgba(248,234,212,.76);line-height:1.75;font-size:13px;font-weight:700}.force-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.force-mini{min-height:118px;border:1px solid rgba(214,169,88,.18);background:radial-gradient(circle at 50% 25%,rgba(227,177,93,.16),rgba(255,255,255,.035) 62%);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}.force-mini img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:94%;height:90px;object-fit:contain;filter:drop-shadow(0 7px 6px rgba(0,0,0,.35))}.force-mini .name{position:relative;z-index:2;padding:28px 6px 8px;color:#f4d597;font-weight:1000;font-size:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}.force-mini small{display:block;color:rgba(248,234,212,.58);font-size:9px;margin-top:2px}.btn{width:100%;border:0;cursor:pointer;border-radius:18px;padding:15px 16px;margin-top:15px;color:#211009;background:linear-gradient(90deg,#efd08a,#c99038);font-size:17px;font-weight:1000;box-shadow:0 14px 26px rgba(201,144,56,.18)}.btn.dark{color:#f8ead4;background:rgba(255,255,255,.07);border:1px solid rgba(214,169,88,.24);box-shadow:none}.progress-top{display:flex;justify-content:space-between;color:rgba(248,234,212,.64);font-size:12px;font-weight:900;margin-bottom:8px}.progress{height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(214,169,88,.12);margin-bottom:15px}.bar{height:100%;background:linear-gradient(90deg,#b92f25,#d8a646)}.q-card{padding:17px 13px}.q-tag{display:inline-block;color:#e3b15d;border:1px solid rgba(214,169,88,.22);background:rgba(214,169,88,.08);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}h2{margin:13px 0 15px;font-size:22px;line-height:1.34;color:#fff2cf;letter-spacing:-.3px}.options{display:grid;gap:9px}.option{width:100%;border:1px solid rgba(214,169,88,.18);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));color:#f8ead4;border-radius:16px;padding:11px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-size:14px;line-height:1.5;font-weight:750}.letter{width:31px;height:31px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;background:linear-gradient(180deg,#b92f25,#7d211b);color:#fff4d2;font-weight:1000}.result-card{padding:18px 14px;background:linear-gradient(160deg,rgba(124,31,23,.86),rgba(27,16,13,.94) 58%,rgba(177,125,48,.55))}.result-card:before{content:attr(data-mark);position:absolute;right:10px;top:8px;font-size:86px;font-weight:1000;color:rgba(255,255,255,.055)}.result-image-wrap{height:190px;margin:-6px -8px 2px;display:flex;align-items:flex-end;justify-content:center;position:relative}.result-image{max-width:230px;max-height:210px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 12px 12px rgba(0,0,0,.48))}.result-label{display:inline-block;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#f4d597;font-size:12px;font-weight:1000}.force-name{margin-top:10px;font-size:54px;line-height:.96;font-weight:1000;color:#fff3cd;text-shadow:0 4px 0 rgba(0,0,0,.22)}.force-title{margin-top:8px;color:#e3b15d;font-size:21px;font-weight:1000}.slogan{margin-top:7px;color:rgba(248,234,212,.78);font-weight:850}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}.chip{padding:7px 10px;border-radius:999px;background:rgba(227,177,93,.16);border:1px solid rgba(227,177,93,.2);color:#f4d597;font-size:12px;font-weight:1000}.result-text{margin-top:13px;line-height:1.72;font-size:14px;color:rgba(248,234,212,.84);font-weight:750}.info{display:grid;gap:9px;margin-top:12px}.info-box{border-radius:16px;padding:11px;background:rgba(0,0,0,.16);border:1px solid rgba(214,169,88,.14)}.info-box b{display:block;color:#e3b15d;font-size:12px;margin-bottom:5px}.info-box span{color:rgba(248,234,212,.84);line-height:1.6;font-size:13px;font-weight:750}.share{margin-top:11px;padding:11px;border-radius:18px;background:rgba(214,169,88,.1);border:1px solid rgba(214,169,88,.15);color:rgba(248,234,212,.78);line-height:1.6;font-size:13px;font-weight:850}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;transition:.2s;z-index:20;padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.78);color:#f8ead4;font-size:13px;font-weight:1000}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-height:760px){.force-mini{min-height:104px}.force-mini img{height:78px}.result-image-wrap{height:160px}.result-image{max-height:180px}.force-name{font-size:48px}h1{font-size:34px}h2{font-size:20px}}@media(max-width:360px){.page{padding:10px}.inner{padding:17px 13px}h1{font-size:34px}.force-name{font-size:48px}.actions{grid-template-columns:1fr}}

.share-modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;padding:18px}
.share-modal.show{display:flex}
.share-box{width:min(100%,380px);border-radius:24px;background:#160d0a;border:1px solid rgba(214,169,88,.3);padding:14px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
.share-box-title{display:flex;justify-content:space-between;align-items:center;color:#f4d597;font-weight:1000;font-size:14px;margin-bottom:10px}
.share-close{border:0;background:rgba(255,255,255,.08);color:#f8ead4;border-radius:999px;width:30px;height:30px;font-size:18px}
.share-preview{display:block;width:100%;border-radius:18px;background:#0f0806;border:1px solid rgba(214,169,88,.2)}
.share-tip{margin:10px 4px 2px;color:rgba(248,234,212,.7);font-size:12px;line-height:1.6;font-weight:800;text-align:center}
.actions.three{grid-template-columns:1fr 1fr}.actions.three .wide{grid-column:1/3}

function startTest(){current=0;answers=[];questionPage()}function choose(k){answers[current]=k;if(current>=questions.length-1)resultPage();else{current++;questionPage()}}function copyResult(){const{key}=getResult(),f=forces[key],text=`我的新赛季推荐势力是【${f.name}】｜${f.title}：${f.subtitle}`;if(navigator.clipboard)navigator.clipboard.writeText(text).then(toast);else toast()}function toast(){const t=document.getElementById("toast");t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  let line="",lines=[];
  for(let i=0;i<text.length;i++){
    let test=line+text[i];
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);line=text[i];
      if(lines.length>=maxLines-1)break;
    }else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,maxLines).forEach((l,idx)=>ctx.fillText(l,x,y+idx*lineHeight));
}
function loadImage(src){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    im.onload=()=>resolve(im);
    im.onerror=reject;
    im.src=src;
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

    startX+=w+20;
  });

  ctx.textAlign="left";
  ctx.fillStyle="rgba(248,234,212,.86)";
  ctx.font="700 30px sans-serif";
  wrapText(ctx,f.desc,105,1092,690,42,3);
  const qr=await loadImage(qrImg);

  // CTA copy placed in the middle-safe area, QR stays at bottom-right inside the orange frame.
  ctx.textAlign="center";
  ctx.fillStyle="#f4d597";
  ctx.font="900 26px sans-serif";
  ctx.fillText("扫码参与测试",360,1232);

  ctx.fillStyle="rgba(248,234,212,.72)";
  ctx.font="800 20px sans-serif";
  ctx.fillText("群英并起｜九州落点测试",360,1268);

  ctx.font="700 18px sans-serif";
  ctx.fillText("测测你该落哪一州",360,1296);

  // Right-bottom QR fully inside the orange frame.
  const qrSize = 108;
  const quiet = 10;
  const cardSize = qrSize + quiet * 2;
  const cardX = 642;
  const cardY = 1214;

  ctx.fillStyle="#ffffff";
  roundRect(ctx,cardX,cardY,cardSize,cardSize,14);
  ctx.fill();

  ctx.strokeStyle="rgba(214,169,88,.22)";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.drawImage(qr,cardX + quiet,cardY + quiet,qrSize,qrSize);

  document.getElementById("sharePreview").src=canvas.toDataURL("image/png");
  document.getElementById("shareModal").classList.add("show");
}
function closeShareCard(){
  document.getElementById("shareModal").classList.remove("show");
}

startPage();
</script></body></html>
