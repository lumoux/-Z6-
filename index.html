deg,rgba(100,32,24,.66),rgba(22,13,10,.78));border:1px solid rgba(214,169,88,.22);box-shadow:0 16px 42px rgba(0,0,0,.27);overflow:hidden;position:relative}.hero-card{padding:14px;text-align:center}.kv{border-radius:18px;overflow:hidden;border:1px solid rgba(214,169,88,.25);margin-bottom:14px;background:#120b08}.kv img{display:block;width:100%}.kicker{display:inline-block;padding:7px 14px;border-radius:999px;background:linear-gradient(90deg,#b92f25,#d8a646);color:#fff7df;font-size:13px;font-weight:1000}h1{margin:15px 0 7px;font-size:38px;line-height:1.06;font-weight:1000;letter-spacing:-1px;color:#fff4d2;text-shadow:0 3px 0 rgba(0,0,0,.22)}h1 span{display:block;color:#e3b15d}.lead{margin:0 auto;max-width:350px;color:rgba(248,234,212,.76);line-height:1.75;font-size:13px;font-weight:700;text-align:center}.lead span{display:block;white-space:nowrap}.disclaimer{margin:10px auto 0;max-width:350px;color:rgba(248,234,212,.52);line-height:1.55;font-size:11px;font-weight:700}.force-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.force-mini{min-height:118px;border:1px solid rgba(214,169,88,.18);background:radial-gradient(circle at 50% 25%,rgba(227,177,93,.16),rgba(255,255,255,.035) 62%);border-radius:16px;overflow:hidden;position:relative;display:flex;flex-direction:column;justify-content:flex-end}.force-mini img{position:absolute;left:50%;top:4px;transform:translateX(-50%);width:94%;height:90px;object-fit:contain;filter:drop-shadow(0 7px 6px rgba(0,0,0,.35))}.force-mini .name{position:relative;z-index:2;padding:28px 6px 8px;color:#f4d597;font-weight:1000;font-size:14px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72))}.force-mini small{display:block;color:rgba(248,234,212,.58);font-size:9px;margin-top:2px}.btn{width:100%;border:0;cursor:pointer;border-radius:18px;padding:15px 16px;margin-top:15px;color:#211009;background:linear-gradient(90deg,#efd08a,#c99038);font-size:17px;font-weight:1000;box-shadow:0 14px 26px rgba(201,144,56,.18)}.btn.dark{color:#f8ead4;background:rgba(255,255,255,.07);border:1px solid rgba(214,169,88,.24);box-shadow:none}.progress-top{display:flex;justify-content:space-between;color:rgba(248,234,212,.64);font-size:12px;font-weight:900;margin-bottom:8px}.progress{height:8px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(214,169,88,.12);margin-bottom:15px}.bar{height:100%;background:linear-gradient(90deg,#b92f25,#d8a646)}.q-card{padding:17px 13px}.q-tag{display:inline-block;color:#e3b15d;border:1px solid rgba(214,169,88,.22);background:rgba(214,169,88,.08);border-radius:999px;padding:6px 10px;font-size:12px;font-weight:1000}h2{margin:13px 0 15px;font-size:22px;line-height:1.34;color:#fff2cf;letter-spacing:-.3px}.options{display:grid;gap:9px}.option{width:100%;border:1px solid rgba(214,169,88,.18);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.04));color:#f8ead4;border-radius:16px;padding:11px;display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;font-size:14px;line-height:1.5;font-weight:750}.letter{width:31px;height:31px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;background:linear-gradient(180deg,#b92f25,#7d211b);color:#fff4d2;font-weight:1000}.result-card{padding:18px 14px;background:linear-gradient(160deg,rgba(124,31,23,.86),rgba(27,16,13,.94) 58%,rgba(177,125,48,.55))}.result-card:before{content:attr(data-mark);position:absolute;right:10px;top:8px;font-size:86px;font-weight:1000;color:rgba(255,255,255,.055)}.result-image-wrap{height:190px;margin:-6px -8px 2px;display:flex;align-items:flex-end;justify-content:center;position:relative}.result-image{max-width:230px;max-height:210px;object-fit:contain;position:relative;z-index:1;filter:drop-shadow(0 12px 12px rgba(0,0,0,.48))}.result-label{display:inline-block;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);color:#f4d597;font-size:12px;font-weight:1000}.f let current=0,answers=[];const app=document.getElementById("app");

function questionPage(){const item=questions[current],pct=Math.round((current+1)/questions.length*100);app.innerHTML=topBar()+`<section class="question"><div class="progress-top"><span>第 ${current+1} 题 / 共 ${questions.length} 题</span><span>${pct}%</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="q-card"><div class="q-tag">${item.tag}</div><h2>${item.q}</h2><div class="options">${item.options.map(([k,t])=>`<button class="option" onclick="choose('${k}')"><span class="letter">${k}</span><span>${t}</span></button>`).join("")}</div></div></section>`}
function getResult(){const scores={A:0,B:0,C:0,D:0,E:0,F:0};answers.forEach(a=>scores[a]++);const max=Math.max(...Object.values(scores)),tied=Object.keys(scores).filter(k=>scores[k]===max);let key=tied[0];if(tied.length>1&&tied.includes(answers[7]))key=answers[7];else if(tied.length>1&&tied.includes(answers[5]))key=answers[5];return{key,scores,tied}}

function startTest(){current=0;answers=[];questionPage()}function choose(k){answers[current]=k;if(current>=questions.length-1)resultPage();else{current++;questionPage()}}function toast(msg="操作成功"){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1500)}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
  let line="",lines=[];
  for(let i=0;i<text.length;i++){
    let test=line+text[i];
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);line=text[i];
      if(lines.length>=maxLines-1)break;
    }else line=test;
  }
  if(line)lines.push(line);
  lines.slice(0,maxLines).forEach((l,idx)=>ctx.fillText(l,x,y+idx*lineHeight));
}
function loadImage(src, timeout=1800){
  return new Promise((resolve,reject)=>{
    const im=new Image();
    let done=false;
    const timer=setTimeout(()=>{
      if(done) return;
      done=true;
      reject(new Error("image load timeout: "+src));
    },timeout);
    im.onload=()=>{
      if(done) return;
      done=true;
      clearTimeout(timer);
      resolve(im);
    };
    im.onerror=()=>{
      if(done) return;
      done=true;
      clearTimeout(timer);
      reject(new Error("image load error: "+src));
    };
    im.src=src;
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

    }catch(e){
      console.warn("embedded character failed:", e);
      ctx.fillStyle="rgba(227,177,93,.16)";
      ctx.beginPath();
      ctx.arc(450,285,132,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle="#f4d597";
      ctx.font="900 80px sans-serif";
      ctx.textAlign="center";
      ctx.fillText(f.mark,450,315);
    }

    ctx.textAlign="center";
    ctx.fillStyle="#f4d597";
    ctx.font="900 34px sans-serif";
    ctx.fillText("我的九州开局人格",450,560);

    ctx.fillStyle="#fff3cd";
    ctx.font="900 58px sans-serif";

      ctx.stroke();
      ctx.fillStyle="#f4d597";

    ctx.fillStyle="#f4d597";

    try{
      const qr=await loadImage(shareQrImg,2000);

    ctx.font="900 34px sans-serif";
    ctx.fillText("扫码参与测试",450,900);
    preview.src=canvas.toDataURL("image/png");
    toast("分享图已生成");
  }
}

function wrapLines(ctx,text,maxWidth,maxLines){
  let line="",lines=[];
  for(let i=0;i<text.length;i++){
    const test=line+text[i];
    if(ctx.measureText(test).width>maxWidth&&line){
      lines.push(line);
      line=text[i];
      if(lines.length>=maxLines-1)break;
    }else{
      line=test;
    }
  }
  if(line)lines.push(line);
  return lines.slice(0,maxLines);
}

function closeShareCard(){
  document.getElementById("shareModal").classList.remove("show");
}

async function downloadShareImage(){

    await showShareCard();
  }
  const src=imgEl.src;
  if(!src){
    toast("分享图还在生成中");
    return;
  }
  try{
    const a=document.createElement("a");
    a.href=src;
    a.download=`九州开局人格测试_${Date.now()}.png`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast("分享图已生成，可保存使用");
  }catch(e){
    window.open(src,"_blank");
    toast("已打开分享图，请长按保存");
  }
}
