<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>九州落点测试</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: #f8ead4;
      background:
        radial-gradient(circle at 50% -10%, rgba(191, 146, 64, .35), transparent 34%),
        radial-gradient(circle at 18% 18%, rgba(148, 28, 22, .38), transparent 30%),
        radial-gradient(circle at 86% 70%, rgba(168, 95, 37, .24), transparent 30%),
        linear-gradient(180deg, #130b08 0%, #24100d 42%, #090706 100%);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(224, 178, 91, .05) 1px, transparent 1px),
        linear-gradient(180deg, rgba(224, 178, 91, .05) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.7), transparent 88%);
      pointer-events: none;
    }
    body::after {
      content: "";
      position: fixed;
      left: -20%;
      right: -20%;
      bottom: -16%;
      height: 36vh;
      background: radial-gradient(ellipse at center, rgba(198, 49, 31, .25), transparent 70%);
      pointer-events: none;
    }
    .page {
      width: min(100%, 430px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 16px 14px 24px;
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel {
      width: 100%;
      min-height: calc(100vh - 40px);
      border-radius: 28px;
      border: 1px solid rgba(214, 169, 88, .24);
      background:
        linear-gradient(180deg, rgba(39, 22, 18, .92), rgba(15, 10, 8, .96)),
        radial-gradient(circle at 50% 0, rgba(214, 169, 88, .2), transparent 40%);
      box-shadow: 0 22px 70px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04);
      overflow: hidden;
      position: relative;
    }
    .panel::before {
      content: "";
      position: absolute;
      inset: 12px;
      border-radius: 22px;
      border: 1px solid rgba(214, 169, 88, .12);
      pointer-events: none;
    }
    .inner {
      min-height: calc(100vh - 40px);
      padding: 22px 18px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(214, 169, 88, .36);
      background: rgba(214, 169, 88, .10);
      color: #f4d597;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 800;
      font-size: 13px;
    }
    .season {
      color: rgba(248, 234, 212, .54);
      font-size: 12px;
      font-weight: 700;
    }
    .start, .result, .question {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .title-card {
      position: relative;
      padding: 30px 16px 22px;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(92, 31, 24, .62), rgba(24, 14, 11, .76)),
        radial-gradient(circle at 50% 0, rgba(216, 166, 70, .22), transparent 45%);
      border: 1px solid rgba(214, 169, 88, .22);
      box-shadow: 0 16px 42px rgba(0,0,0,.25);
      overflow: hidden;
      text-align: center;
    }
    .title-card::before {
      content: "群英并起";
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 46px;
      font-weight: 1000;
      letter-spacing: 4px;
      color: rgba(255,255,255,.035);
      white-space: nowrap;
    }
    .kicker {
      display: inline-block;
      padding: 7px 14px;
      border-radius: 999px;
      background: linear-gradient(90deg, #b92f25, #d8a646);
      color: #fff7df;
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(185, 47, 37, .25);
      position: relative;
      z-index: 1;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: 42px;
      line-height: 1.08;
      font-weight: 1000;
      letter-spacing: -1px;
      color: #fff4d2;
      text-shadow: 0 3px 0 rgba(0,0,0,.22);
      position: relative;
      z-index: 1;
    }
    h1 span {
      color: #e3b15d;
      display: block;
    }
    .lead {
      color: rgba(248, 234, 212, .76);
      line-height: 1.8;
      font-size: 14px;
      margin: 0 auto;
      max-width: 350px;
      position: relative;
      z-index: 1;
    }
    .force-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 18px;
    }
    .force-mini {
      border: 1px solid rgba(214, 169, 88, .16);
      background: rgba(255,255,255,.045);
      border-radius: 16px;
      padding: 10px 6px;
      text-align: center;
      color: #f4d597;
      font-weight: 900;
      font-size: 14px;
    }
    .force-mini small {
      display: block;
      color: rgba(248, 234, 212, .5);
      font-size: 10px;
      margin-top: 3px;
      font-weight: 700;
    }
    .btn {
      width: 100%;
      border: 0;
      cursor: pointer;
      border-radius: 18px;
      padding: 15px 16px;
      margin-top: 18px;
      color: #211009;
      background: linear-gradient(90deg, #efd08a, #c99038);
      font-size: 17px;
      font-weight: 1000;
      box-shadow: 0 14px 26px rgba(201, 144, 56, .18), inset 0 -2px 0 rgba(63, 29, 10, .18);
    }
    .btn.dark {
      color: #f8ead4;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(214, 169, 88, .24);
      box-shadow: none;
    }
    .progress-top {
      display: flex;
      justify-content: space-between;
      color: rgba(248, 234, 212, .64);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .progress {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(214, 169, 88, .12);
      margin-bottom: 18px;
    }
    .bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #b92f25, #d8a646);
      transition: width .2s ease;
    }
    .q-card {
      border-radius: 24px;
      padding: 18px 14px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(214, 169, 88, .18);
      box-shadow: 0 16px 38px rgba(0,0,0,.18);
    }
    .q-tag {
      display: inline-block;
      color: #e3b15d;
      border: 1px solid rgba(214, 169, 88, .22);
      background: rgba(214, 169, 88, .08);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 900;
    }
    h2 {
      margin: 14px 0 16px;
      font-size: 23px;
      line-height: 1.34;
      color: #fff2cf;
      letter-spacing: -.3px;
    }
    .options {
      display: grid;
      gap: 10px;
    }
    .option {
      width: 100%;
      border: 1px solid rgba(214, 169, 88, .18);
      background: linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
      color: #f8ead4;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.55;
      font-weight: 700;
    }
    .option:active {
      background: rgba(214, 169, 88, .16);
      transform: scale(.99);
    }
    .letter {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: linear-gradient(180deg, #b92f25, #7d211b);
      color: #fff4d2;
      font-weight: 1000;
      border: 1px solid rgba(255,255,255,.12);
    }
    .result-card {
      border-radius: 26px;
      padding: 22px 16px;
      background:
        linear-gradient(160deg, rgba(124, 31, 23, .86), rgba(27, 16, 13, .94) 58%, rgba(177, 125, 48, .55)),
        radial-gradient(circle at 80% 0, rgba(227, 177, 93, .22), transparent 35%);
      border: 1px solid rgba(214, 169, 88, .28);
      box-shadow: 0 18px 46px rgba(0,0,0,.32);
      position: relative;
      overflow: hidden;
    }
    .result-card::before {
      content: attr(data-mark);
      position: absolute;
      right: 12px;
      top: 12px;
      font-size: 86px;
      font-weight: 1000;
      color: rgba(255,255,255,.055);
    }
    .result-label {
      display: inline-block;
      border-radius: 999px;
      padding: 7px 12px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      color: #f4d597;
      font-size: 12px;
      font-weight: 900;
      position: relative;
      z-index: 1;
    }
    .force-name {
      margin-top: 13px;
      font-size: 62px;
      line-height: .96;
      font-weight: 1000;
      color: #fff3cd;
      text-shadow: 0 4px 0 rgba(0,0,0,.22);
      position: relative;
      z-index: 1;
    }
    .force-title {
      margin-top: 10px;
      color: #e3b15d;
      font-size: 22px;
      font-weight: 1000;
      position: relative;
      z-index: 1;
    }
    .slogan {
      margin-top: 7px;
      color: rgba(248, 234, 212, .78);
      font-weight: 800;
      position: relative;
      z-index: 1;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      position: relative;
      z-index: 1;
    }
    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(227, 177, 93, .16);
      border: 1px solid rgba(227, 177, 93, .20);
      color: #f4d597;
      font-size: 12px;
      font-weight: 900;
    }
    .result-text {
      margin-top: 15px;
      line-height: 1.75;
      font-size: 14px;
      color: rgba(248, 234, 212, .84);
      font-weight: 700;
      position: relative;
      z-index: 1;
    }
    .info {
      display: grid;
      gap: 10px;
      margin-top: 14px;
      position: relative;
      z-index: 1;
    }
    .info-box {
      border-radius: 16px;
      padding: 12px;
      background: rgba(0,0,0,.16);
      border: 1px solid rgba(214, 169, 88, .14);
    }
    .info-box b {
      display: block;
      color: #e3b15d;
      font-size: 12px;
      margin-bottom: 5px;
    }
    .info-box span {
      color: rgba(248, 234, 212, .84);
      line-height: 1.6;
      font-size: 13px;
      font-weight: 700;
    }
    .share {
      margin-top: 12px;
      padding: 12px;
      border-radius: 18px;
      background: rgba(214, 169, 88, .10);
      border: 1px solid rgba(214, 169, 88, .15);
      color: rgba(248, 234, 212, .78);
      line-height: 1.6;
      font-size: 13px;
      font-weight: 800;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(10px);
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 20;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(0,0,0,.78);
      color: #f8ead4;
      font-size: 13px;
      font-weight: 900;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 360px) {
      .page { padding: 10px; }
      .inner { padding: 18px 14px; }
      h1 { font-size: 38px; }
      .force-name { font-size: 54px; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="panel">
      <div class="inner" id="app"></div>
    </div>
  </div>
  <div class="toast" id="toast">已复制结果文案</div>

<script>
const forces = {
  A:{name:"曹操",title:"强节奏推进者",mark:"魏",subtitle:"乱世未定，你先落子。",keywords:["抢节奏","主动压制","快速推进","战场掌控"],desc:"你不是来等局势变化的，你更适合主动推动局势变化。开局抢点、快速推进、正面压制，都会让你更有参与感。",position:"前期节奏点 / 关键资源点 / 正面推进线",style:"先手行动，快速压制，把对手拖进你的节奏里。"},
  B:{name:"马腾",title:"铁骑破局者",mark:"凉",subtitle:"铁骑所至，战局即变。",keywords:["高机动","快速支援","冲锋破阵","一波破局"],desc:"你不喜欢慢慢等机会，你更习惯直接撞开缺口。战场一旦出现空档，你就是最适合冲进去的人。",position:"侧翼战场 / 支援路线 / 突袭突破点",style:"快速移动，找准缺口，用一波冲锋改变战局。"},
  C:{name:"袁绍",title:"联盟统筹者",mark:"袁",subtitle:"群雄并起，势成则胜。",keywords:["联盟协作","资源整合","集结推进","规模优势"],desc:"你赢的不是一波操作，而是一整套布局。跟随组织节奏，整合资源，打出大场面，会比单打独斗更适合你。",position:"主战场集结点 / 联盟推进线 / 资源争夺区",style:"跟随联盟节奏，集中力量，通过协同扩大优势。"},
  D:{name:"刘彰",title:"稳守发育者",mark:"蜀",subtitle:"守得住，才翻得起。",keywords:["稳健发育","防守经营","据点守护","后期反打"],desc:"你不是不打，而是不想乱打。先把资源、地盘和防线稳住，再等待对手露出破绽，后发制人会更符合你的作战习惯。",position:"资源区 / 防守据点 / 后期反攻路线",style:"先稳住局面，再寻找反打机会。"},
  E:{name:"士燮",title:"南境经营者",mark:"士",subtitle:"不争一时，亦可成势。",keywords:["灵活经营","边路发育","外交周旋","避实击虚"],desc:"你不急着站到最前面，但你总能找到自己的发展空间。别人正面交战时，你已经在观察局势，寻找更舒服的发育路线。",position:"边路区域 / 战略缓冲地带 / 外交交界处",style:"避开无意义硬拼，在复杂局势里找到自己的机会。"},
  F:{name:"孙策",title:"江东猛攻者",mark:"吴",subtitle:"江东破阵，一战成名。",keywords:["正面强攻","爆发突破","战意拉满","快速开战"],desc:"你要的不是稳稳赢，而是打得够痛快。短兵相接、快速开战、强势压上，才是最能点燃你战意的战场节奏。",position:"正面交战区 / 突破口 / 强攻推进线",style:"用爆发和压迫感撕开战线，先把气势打出来。"}
};

const questions = [
  {tag:"开荒第一天",q:"新赛季开荒第一天，你最想先做什么？",options:[["A","抢关键资源点，先把节奏带起来"],["B","快速铺路支援，准备打第一波架"],["C","跟着联盟统一行动，稳住整体节奏"],["D","先发育主城和资源，不急着开战"],["E","观察周围局势，找舒服位置发育"],["F","直接往前压，先给附近对手压力"]]},
  {tag:"邻州来袭",q:"如果邻州很快打过来，你会怎么处理？",options:[["A","主动反压，不能让对面站稳"],["B","绕侧路切入，找机会破局"],["C","听指挥集结，靠组织打正面团"],["D","守住关键要地，等对面消耗"],["E","先避开正面战，找更好突破口"],["F","直接迎战，一波猛攻打回去"]]},
  {tag:"战场体验",q:"你最喜欢哪种战场体验？",options:[["A","节奏拉满，一路压过去"],["B","快速支援，一波冲锋改变战局"],["C","大部队集结，打出联盟气势"],["D","稳稳守住关键点，让对面打不进来"],["E","靠判断和位置感找机会"],["F","正面硬碰硬，打出压迫感和爽感"]]},
  {tag:"强敌压境",q:"面对强敌压境，你第一反应是？",options:[["A","先打乱对方节奏，不能被动挨打"],["B","找机会切侧翼或偷关键点"],["C","组织盟友，统一行动再打"],["D","收缩防线，保证资源和据点安全"],["E","避开正面锋芒，换一路打开局面"],["F","直接集火突破，先把气势打出来"]]},
  {tag:"联盟定位",q:"你在联盟里更像哪种人？",options:[["A","带节奏的人，喜欢推动大家行动"],["B","机动支援位，哪里需要就去哪"],["C","团队协作位，适合跟大部队一起打"],["D","稳定补位，发育、守点、后勤都能做"],["E","战场观察位，喜欢找空档和机会"],["F","正面输出位，开战时愿意顶在前面"]]},
  {tag:"优势偏好",q:"如果只能选一个新赛季优势，你最想要哪种？",options:[["A","前期压制能力"],["B","高机动和快速支援"],["C","联盟规模和资源整合"],["D","防守能力和稳定发育"],["E","灵活经营和局势适应"],["F","正面爆发和强攻能力"]]},
  {tag:"雷点排除",q:"你最讨厌哪种局面？",options:[["A","节奏太慢，大家都不主动"],["B","地图太死，没法快速支援和切入"],["C","队友各打各的，没有组织"],["D","开局就被乱战拖垮发育"],["E","被迫正面硬刚，没有周旋空间"],["F","打得太保守，一点压迫感都没有"]]},
  {tag:"赛季剧本",q:"你希望新赛季自己的剧本是？",options:[["A","开局定调，越打越强"],["B","铁骑突进，一波破局"],["C","群雄集结，靠联盟打出大场面"],["D","稳住前期，后期反推翻盘"],["E","藏锋蓄势，找准时机做大"],["F","江东破阵，正面打出名声"]]}
];

let current = 0;
let answers = [];
const app = document.getElementById("app");

function topBar(){
  return '<div class="top"><div class="badge">⚔ 九州落点测试</div><div class="season">Z6 · 群英并起</div></div>';
}

function startPage(){
  app.innerHTML = topBar() + `
    <section class="start">
      <div class="title-card">
        <div class="kicker">新赛季势力特性</div>
        <h1>测测你该<span>落哪一州</span></h1>
        <p class="lead">六方势力各有锋芒。答完 8 道题，看看你更适合正面猛攻、铁骑破局，还是稳守发育、边路经营。</p>
        <div class="force-grid">
          ${Object.values(forces).map(f=>`<div class="force-mini">${f.name}<small>${f.title}</small></div>`).join("")}
        </div>
      </div>
      <button class="btn" onclick="startTest()">开始测试</button>
    </section>`;
}

function questionPage(){
  const item = questions[current];
  const pct = Math.round((current + 1) / questions.length * 100);
  app.innerHTML = topBar() + `
    <section class="question">
      <div class="progress-top"><span>第 ${current+1} 题 / 共 ${questions.length} 题</span><span>${pct}%</span></div>
      <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
      <div class="q-card">
        <div class="q-tag">${item.tag}</div>
        <h2>${item.q}</h2>
        <div class="options">
          ${item.options.map(([k,t])=>`<button class="option" onclick="choose('${k}')"><span class="letter">${k}</span><span>${t}</span></button>`).join("")}
        </div>
      </div>
    </section>`;
}

function getResult(){
  const scores = {A:0,B:0,C:0,D:0,E:0,F:0};
  answers.forEach(a=>scores[a]++);
  const max = Math.max(...Object.values(scores));
  const tied = Object.keys(scores).filter(k=>scores[k]===max);
  let key = tied[0];
  if(tied.length>1 && tied.includes(answers[7])) key = answers[7];
  else if(tied.length>1 && tied.includes(answers[5])) key = answers[5];
  return {key,scores,tied};
}

function resultPage(){
  const {key} = getResult();
  const f = forces[key];
  app.innerHTML = topBar() + `
    <section class="result">
      <div class="result-card" data-mark="${f.mark}">
        <div class="result-label">你的新赛季推荐势力</div>
        <div class="force-name">${f.name}</div>
        <div class="force-title">${f.title}</div>
        <div class="slogan">${f.subtitle}</div>
        <div class="chips">${f.keywords.map(k=>`<span class="chip">${k}</span>`).join("")}</div>
        <div class="result-text">${f.desc}</div>
        <div class="info">
          <div class="info-box"><b>适合你的战场位置</b><span>${f.position}</span></div>
          <div class="info-box"><b>适合你的作战方式</b><span>${f.style}</span></div>
        </div>
      </div>
      <div class="share">评论区晒出你的结果，看看有没有同州主公提前集合。</div>
      <div class="actions">
        <button class="btn dark" onclick="startPage()">重新测试</button>
        <button class="btn" onclick="copyResult()">复制结果</button>
      </div>
    </section>`;
}

function startTest(){ current = 0; answers = []; questionPage(); }
function choose(k){ answers[current]=k; if(current >= questions.length-1) resultPage(); else { current++; questionPage(); } }
function copyResult(){
  const {key} = getResult();
  const f = forces[key];
  const text = `我的新赛季推荐势力是【${f.name}】｜${f.title}：${f.subtitle}`;
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(toast); } else { toast(); }
}
function toast(){
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1500);
}
startPage();
</script>
</body>
</html>
